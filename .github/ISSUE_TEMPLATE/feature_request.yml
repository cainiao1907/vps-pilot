name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！请重点说明**要解决什么问题**，而不仅是想要什么功能。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 README，确认没有重复
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么痛点？现有功能为什么不够用？
      placeholder: |
        我经常需要在多台服务器上执行同样的运维脚本，
        现在只能一台台连过去手动粘贴，很费时间。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他实现思路？各自的取舍是什么？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - SSH 连接 / 终端
        - AI Agent
        - MCP 服务
        - SFTP 文件管理
        - 危险命令风险引擎
        - 模型 / BYOK 配置
        - 代理 / 连接诊断
        - 专家 / 技能
        - 界面 / 其他
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己实现这个功能并提交 PR
          required: false
